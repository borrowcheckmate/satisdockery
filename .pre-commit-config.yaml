default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --locked -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: file-length
        name: rust files stay under 250 lines
        entry: >-
          bash -c 'for file in "$@"; do
          [ "$(wc -l < "$file")" -le 250 ] ||
          { echo "$file is too long, split it into a submodule"; exit 1; };
          done' --
        language: system
        types: [rust]
      - id: conventional-commit
        name: conventional commit message
        entry: >-
          bash -c 'grep -qE "^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+" "$1" ||
          { echo "commit message must follow Conventional Commits"; exit 1; }' --
        language: system
        stages: [commit-msg]
      - id: no-attribution
        name: no attribution trailers
        entry: >-
          bash -c '! grep -qiE "co-authored-by|generated with|made with" "$1" ||
          { echo "attribution lines are not allowed in commit messages"; exit 1; }' --
        language: system
        stages: [commit-msg]
